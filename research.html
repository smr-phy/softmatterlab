<!DOCTYPE html>
<html lang="en">
<head>
<title>Research Themes | Soft & Active Matter Physics Lab (SAMP) | Ashoka University</title>
<meta name="description" content="Discover our ongoing experimental physics research in soft and active matter, liquid crystal dynamics, and phase transitions at Ashoka University.">
<link rel="icon" type="image/png" href="images/favicon.png">
<meta charset="UTF-8">
<meta name="view-transition" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body class="page-wrapper">

<!-- Preloader Overlay -->
<div id="preloader">
  <div class="preloader-content">
    <img src="images/favicon.png" alt="Lab Logo" class="preloader-logo">
  </div>
</div>

<div id="nav-placeholder"></div>

<section id="research" class="page-content">
  <div class="research-header">
    <div>
      <div class="section-label">Our Science</div>
      <h2 class="section-title">Research Projects</h2>
    </div>
  </div>
  
  <div class="research-grid" id="research-container">
    <p style="grid-column: 1/-1;">Loading research data...</p>
  </div>
</section>

<div id="footer-placeholder"></div>

<script>
  // Hide preloader helper
  function hidePreloader() {
    const preloader = document.getElementById('preloader');
    if (preloader && !preloader.classList.contains('hidden')) {
      preloader.classList.add('hidden');
      setTimeout(() => preloader.style.display = 'none', 400);
    }
  }

  // Load Research Cards
  const researchPromise = fetch('data/research.json')
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById('research-container');
      container.innerHTML = data.map(res => `
        <div class="research-card ${res.color}">
          <div class="rc-number">${res.number}</div>
          <div class="rc-title">${res.title}</div>
          <p class="rc-desc">${res.desc}</p>
          <div class="rc-tags">${res.tags.map(t => `<span class="rc-tag">${t}</span>`).join('')}</div>
          <div class="rc-details"><p>${res.details}</p></div>
        </div>
      `).join('');
      
      // Accordion Logic
      container.addEventListener('click', function(e) {
        const clickedCard = e.target.closest('.research-card');
        if (!clickedCard) return;
        container.querySelectorAll('.research-card').forEach(card => {
          if (card !== clickedCard) card.classList.remove('expanded');
        });
        clickedCard.classList.toggle('expanded');
      });
    })
    .catch(err => {
      console.log('Error loading research data:', err);
      document.getElementById('research-container').innerHTML = '<p style="grid-column: 1/-1;">Failed to load research data.</p>';
    });

  // Load Navigation
  const navPromise = fetch('nav.html')
    .then(r => r.text())
    .then(data => {
      document.getElementById('nav-placeholder').outerHTML = data;
      const hamburger = document.getElementById('hamburger');
      if (hamburger) {
        hamburger.addEventListener('click', function() {
          document.getElementById('nav-links').classList.toggle('active');
          this.classList.toggle('open');
        });
      }
    })
    .catch(err => console.error('Error loading navigation:', err));

  // Load Footer
  const footerPromise = fetch('footer.html')
    .then(r => r.text())
    .then(data => { 
      document.getElementById('footer-placeholder').outerHTML = data; 
    })
    .catch(err => console.error('Error loading footer:', err));

  // Preloader Resolution
  const windowLoadPromise = new Promise(resolve => window.addEventListener('load', resolve));

  Promise.all([windowLoadPromise, researchPromise, navPromise, footerPromise])
    .finally(() => {
      hidePreloader();
    });
</script>
</body>
</html>
