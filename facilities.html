<!DOCTYPE html>
<html lang="en">
<head>
<title>Research Facilities & Equipment | Soft Matter Lab</title>
<meta name="description" content="Explore the advanced experimental facilities of the Soft Matter Lab, including precise thermal controllers, polarizing microscopes, and light scattering setups.">
<link rel="icon" type="image/png" href="images/favicon.png">
<meta charset="UTF-8">
<meta name="view-transition" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body class="page-wrapper">

<!-- Preloader Overlay -->
<div id="preloader">
  <div class="preloader-content">
    <img src="images/favicon.png" alt="Lab Logo" class="preloader-logo">
    <div class="preloader-spinner"></div>
  </div>
</div>

<div id="nav-placeholder"></div>

<section id="facilities" class="page-content">
  <div class="section-label">Equipment & Hardware</div>
  <h2 class="section-title">Research Facilities</h2>
  <p class="section-intro spacing-bottom-lg">Click on any instrument to view its details and applications within our lab.</p>
  
  <div class="facilities-grid" id="facilities-container"><p>Loading facilities...</p></div>
</section>

<div id="footer-placeholder"></div>

<script>
  // Hide preloader helper
  function hidePreloader() {
    const preloader = document.getElementById('preloader');
    if (preloader && !preloader.classList.contains('hidden')) {
      preloader.classList.add('hidden');
      setTimeout(() => preloader.style.display = 'none', 400);
    }
  }

  // Fetch Facilities Data
  const facilitiesPromise = fetch('data/facilities.json')
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById('facilities-container');
      container.innerHTML = data.map(fac => `
        <div class="facility-card">
          <img src="${fac.image}" alt="${fac.title}" class="facility-img" onerror="this.onerror=null; this.src='images/placeholder.jpg'">
          
          <div class="facility-body">
            <div class="facility-title">${fac.title}</div>
            <div class="facility-content"><p>${fac.desc}</p></div>
          </div>
        </div>
      `).join('');
      
      // Accordion Logic
      container.addEventListener('click', function(e) {
        const clickedCard = e.target.closest('.facility-card');
        if (!clickedCard) return;
        container.querySelectorAll('.facility-card').forEach(card => {
          if (card !== clickedCard) card.classList.remove('expanded');
        });
        clickedCard.classList.toggle('expanded');
      });
    })
    .catch(err => {
      console.error('Error loading facilities data:', err);
      document.getElementById('facilities-container').innerHTML = '<p>Failed to load facilities data.</p>';
    });

  // Fetch Navigation
  const navPromise = fetch('nav.html')
    .then(r => r.text())
    .then(data => {
      document.getElementById('nav-placeholder').outerHTML = data;
      const hamburger = document.getElementById('hamburger');
      if (hamburger) {
        hamburger.addEventListener('click', function() {
          document.getElementById('nav-links').classList.toggle('active'); 
          this.classList.toggle('open');
        });
      }
    })
    .catch(err => console.error('Error loading navigation:', err));

  // Fetch Footer
  const footerPromise = fetch('footer.html')
    .then(r => r.text())
    .then(data => { 
      document.getElementById('footer-placeholder').outerHTML = data; 
    })
    .catch(err => console.error('Error loading footer:', err));

  // Preloader Resolution
  const windowLoadPromise = new Promise(resolve => window.addEventListener('load', resolve));

  Promise.all([windowLoadPromise, facilitiesPromise, navPromise, footerPromise])
    .finally(() => {
      hidePreloader();
    });
</script>
</body>
</html>
