<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  
  <title>Profile | Soft Matter Lab</title>
</head>
<body class="page-wrapper">

<div id="nav-placeholder"></div>

<section class="page-content" style="max-width: 800px; margin: 3rem auto; padding: 0 1.5rem;">
  <a id="back-link" href="people.html" style="display: inline-block; margin-bottom: 2rem; color: var(--teal); font-weight: 700; text-decoration: none; text-transform: uppercase; font-size: 12px; letter-spacing: 0.08em;">← Back to Team</a>
  
  <div id="profile-container">
    <p>Loading profile...</p>
  </div>
</section>

<div id="footer-placeholder"></div>

<script>
  const slugify = (str) => encodeURIComponent(str.toLowerCase().trim().replace(/\s+/g, '-'));

  // Get path segments (handles both custom domains and GitHub project repos)
  const pathSegments = window.location.pathname.split('/').filter(Boolean);
  const profileIndex = pathSegments.indexOf('profile');

  // Calculate base site path to fix relative fetches in subfolders
  const basePath = profileIndex > 0 
    ? '/' + pathSegments.slice(0, profileIndex).join('/') + '/' 
    : '/';

  // Fix "Back to Team" button link
  document.getElementById('back-link').href = `${basePath}people.html`;

  const targetSlug = profileIndex !== -1 && pathSegments[profileIndex + 1] 
    ? decodeURIComponent(pathSegments[profileIndex + 1]).toLowerCase() 
    : '';

  const container = document.getElementById('profile-container');

  if (!targetSlug) {
    container.innerHTML = '<h2 style="color: var(--ink);">Page not found.</h2>';
  } else {
    Promise.all([
      fetch(`${basePath}data/people.json`).then(res => res.json()).catch(() => []),
      fetch(`${basePath}data/alumni.json`).then(res => res.json()).catch(() => [])
    ])
    .then(([people, alumni]) => {
      const allMembers = [...people, ...alumni];
      
      const person = allMembers.find(p => {
        const fullSlug = slugify(p.name).toLowerCase();
        const firstName = p.name.toLowerCase().trim().split(' ')[0];
        return fullSlug === targetSlug || firstName === targetSlug;
      });

      if (person) {
        document.title = `${person.name} | Soft Matter Lab`;
        
        // Handle images stored with relative paths
        const imageSrc = person.image.startsWith('http') || person.image.startsWith('/') 
          ? person.image 
          : `${basePath}${person.image}`;

        container.innerHTML = `
          <div style="background: #fff; padding: 3rem 2.5rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
            <div style="display: flex; gap: 2rem; align-items: center; margin-bottom: 2rem; flex-wrap: wrap;">
              <img src="${imageSrc}" alt="${person.name}" style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 3px solid var(--mist);" onerror="this.onerror=null; this.src='${basePath}images/placeholder.jpg'">
              <div>
                <h1 style="font-size: 2rem; color: var(--ink); margin: 0 0 0.25rem 0;">${person.name}</h1>
                <div style="font-size: 0.9rem; color: var(--teal); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;">${person.role}</div>
              </div>
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 2rem;">
              <h3 style="font-size: 1rem; color: var(--ink); margin-bottom: 0.75rem;">Biography</h3>
              <p style="font-size: 0.95rem; color: var(--slate); line-height: 1.7; margin: 0 0 2rem 0;">${person.bio || 'No biography available.'}</p>
            </div>

            <div class="team-links" style="display: flex; gap: 1rem;">
              ${person.scholar ? `<a href="${person.scholar}" target="_blank" rel="noopener" style="font-size: 11px; font-weight: 700; color: var(--teal); text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em;">Google Scholar</a>` : ''}
              ${person.linkedin ? `<a href="${person.linkedin}" target="_blank" rel="noopener" style="font-size: 11px; font-weight: 700; color: var(--teal); text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em;">LinkedIn</a>` : ''}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = '<h2 style="color: var(--ink);">Member not found.</h2>';
      }
    })
    .catch(err => {
      container.innerHTML = '<p style="color: var(--slate);">Error loading profile details.</p>';
    });
  }

  // Load Nav and Footer using basePath
  Promise.all([
    fetch(`${basePath}nav.html`).then(r => r.text()),
    fetch(`${basePath}footer.html`).then(r => r.text())
  ]).then(([navHtml, footerHtml]) => {
    document.getElementById('nav-placeholder').outerHTML = navHtml;
    document.getElementById('footer-placeholder').outerHTML = footerHtml;
  });
</script>
</body>
</html>
